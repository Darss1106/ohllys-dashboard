<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ohlly's Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#f3f1ea; --panel:#ffffff; --side:#fbfaf6;
    --ink:#22201c; --ink-soft:#6a655b; --ink-faint:#938d81;
    --line:#e6e1d5; --line-strong:#d5cfbf;
    --brand:#1f6f5c; --brand-2:#0f5847; --brand-tint:#e8f2ee;
    --amber:#b9772a; --red:#b23b34; --blue:#3f5d8c;
    --shadow:0 1px 2px rgba(34,32,28,.05), 0 12px 30px -22px rgba(34,32,28,.6);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#161512; --panel:#1e1c18; --side:#1a1815;
      --ink:#f0ede4; --ink-soft:#a9a394; --ink-faint:#7d776b;
      --line:#312e28; --line-strong:#413d35;
      --brand:#4fbfa0; --brand-2:#78d3b8; --brand-tint:#20302b;
      --amber:#d9a15c; --red:#e07b72; --blue:#8aa4d0;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -22px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161512; --panel:#1e1c18; --side:#1a1815;
    --ink:#f0ede4; --ink-soft:#a9a394; --ink-faint:#7d776b;
    --line:#312e28; --line-strong:#413d35;
    --brand:#4fbfa0; --brand-2:#78d3b8; --brand-tint:#20302b;
    --amber:#d9a15c; --red:#e07b72; --blue:#8aa4d0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100%;min-height:520px}
  svg{width:20px;height:20px;flex:0 0 auto}

  .sidebar{width:274px;flex:0 0 274px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:18px 14px}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 16px}
  .brand .name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
  .brand .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#fff;background:var(--brand);padding:3px 9px;border-radius:6px;letter-spacing:.02em;transform:skewX(-8deg)}
  .brand .pill span{display:inline-block;transform:skewX(8deg)}

  .acctwrap{position:relative;margin-bottom:16px}
  .account{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
  .account:hover{border-color:var(--brand)}
  .account .ico{color:var(--ink-soft)}
  .account .who{min-width:0;flex:1;text-align:left}
  .account .who b{font-size:13.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .account .who small{font-size:11.5px;color:var(--ink-faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .account .chev{color:var(--ink-faint);transition:transform .18s}
  .account[aria-expanded="true"] .chev{transform:rotate(180deg)}

  .acctmenu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:30}
  .acctmenu[hidden]{display:none}
  .acctlabel{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:6px 8px 4px}
  .acctopt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-family:inherit}
  .acctopt:hover{background:var(--brand-tint)}
  .acctopt .ico{color:var(--ink-soft)}
  .acctopt .who b{font-size:13px;font-weight:600;display:block}
  .acctopt .who small{font-size:11px;color:var(--ink-faint);display:block}
  .acctopt .who{flex:1;min-width:0}
  .acctopt .chk{color:var(--brand);opacity:0}
  .acctopt.active .chk{opacity:1}
  .acctopt.active{background:var(--brand-tint)}

  nav{display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink-soft);font-family:inherit;font-size:14px;font-weight:500;text-align:left;padding:10px 10px;border-radius:9px;cursor:pointer;transition:background .12s,color .12s}
  .navitem:hover{background:var(--brand-tint);color:var(--ink)}
  .navitem .lbl{flex:1;min-width:0}
  .navitem .chev{width:16px;height:16px;color:var(--ink-faint);transition:transform .18s}
  .navitem[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .navitem.active{background:var(--brand-tint);color:var(--brand-2);font-weight:700}
  .navitem.active svg{color:var(--brand)}
  .navitem:focus-visible,.account:focus-visible,.acctopt:focus-visible,.subitem:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

  .seclabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding:16px 12px 6px;font-weight:600}

  .children{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
  .children.open{grid-template-rows:1fr}
  .children > div{overflow:hidden}
  .subitem{display:block;width:100%;border:0;background:none;color:var(--ink-soft);font-family:inherit;font-size:13px;text-align:left;padding:8px 10px 8px 44px;border-radius:8px;cursor:pointer}
  .subitem:hover{background:var(--brand-tint);color:var(--ink)}
  .subitem.active{color:var(--brand-2);font-weight:600}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .topbar{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
  .topbar h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(19px,3vw,26px);font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);padding:4px 9px;border-radius:999px;white-space:nowrap}
  .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .content{padding:22px 24px 40px;overflow-y:auto}
  .desc{color:var(--ink-soft);font-size:14.5px;max-width:64ch;margin:0 0 22px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}
  .tile .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
  .tile .v{font-family:'Bricolage Grotesque',sans-serif;font-size:27px;font-weight:800;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .tile .s{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .tile.good .v{color:var(--brand-2)}
  .dot{width:9px;height:9px;border-radius:50%}
  .d-green{background:var(--brand)} .d-amber{background:var(--amber)} .d-red{background:var(--red)} .d-blue{background:var(--blue)}

  .placeholder{background:var(--panel);border:1px dashed var(--line-strong);border-radius:16px;padding:30px 24px;display:flex;gap:16px;align-items:flex-start;box-shadow:var(--shadow)}
  .placeholder .pico{width:44px;height:44px;border-radius:12px;background:var(--brand-tint);display:flex;align-items:center;justify-content:center;color:var(--brand);flex:0 0 auto}
  .placeholder .pico svg{width:24px;height:24px}
  .placeholder h2{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;margin:0 0 6px;font-weight:700}
  .placeholder p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5;max-width:60ch}
  .steps{margin:14px 0 0;padding-left:18px;color:var(--ink-soft);font-size:13.5px}
  .steps li{margin-bottom:5px}
  .note{margin-top:22px;font-size:12.5px;color:var(--ink-faint);border-left:2px solid var(--line-strong);padding-left:12px}

  .rtwrap{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  table.rt{border-collapse:collapse;width:100%;font-size:13px;min-width:460px;background:var(--panel)}
  .rt th,.rt td{padding:9px 13px;border-bottom:1px solid var(--line);text-align:left}
  .rt th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);background:var(--side);font-weight:600}
  .rt td.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right}
  .rt th.n{text-align:right}
  .rt tr:last-child td{border-bottom:0}
  .rt .tot td{border-top:2px solid var(--ink);font-weight:700;font-family:'Bricolage Grotesque',sans-serif}

  .chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding:14px 10px 8px;margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
  .bar .col{width:64%;max-width:48px;background:var(--brand);border-radius:6px 6px 0 0}
  .bar .col.live{background:var(--amber)}
  .bar .bval{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .bar .blbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);white-space:nowrap}
  .live-tag{color:var(--amber);font-weight:600}

  .rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow)}
  .rhd{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
  .rhd span{font-family:'IBM Plex Mono',monospace;color:var(--brand-2);font-variant-numeric:tabular-nums}
  .rrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-soft);padding:3px 0}
  .rrow .rc{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

  .datectl{margin-bottom:4px}
  .datesearch{width:100%;max-width:320px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px}
  .datesearch:focus{outline:2px solid var(--brand);outline-offset:1px}
  .datelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .datechip{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer}
  .datechip:hover{background:var(--brand-tint);color:var(--ink)}
  .datechip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .datechip .livedot{color:var(--amber);font-weight:600}
  .datechip.active .livedot{color:#fff}
  .datechip[hidden]{display:none}
  .drhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .drhead .datesearch{flex:1;min-width:200px;max-width:420px}

  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:380px}
  .wbtn{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;padding:7px 13px;border-radius:9px;cursor:pointer}
  .wbtn:hover:not(:disabled){background:var(--brand-tint)}
  .wbtn:disabled{opacity:.4;cursor:default}
  .wlabel{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}

  .segbar{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
  .segbtn{border:0;background:var(--panel);color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:500;padding:8px 18px;cursor:pointer;border-right:1px solid var(--line-strong)}
  .segbtn:last-child{border-right:0}
  .segbtn:hover{background:var(--brand-tint);color:var(--ink)}
  .segbtn.active{background:var(--brand);color:#fff}

  .uprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .uplabel{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .upbtn{border:1px solid var(--brand);background:var(--brand);color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px;cursor:pointer}
  .upbtn:hover{background:var(--brand-2)}
  .uplist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .upitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;box-shadow:var(--shadow)}
  .upitem .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .upitem .st{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber)}
  .upitem .rm{border:0;background:none;color:var(--ink-faint);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
  .upitem .rm:hover{color:var(--red)}
  .upempty{font-size:12.5px;color:var(--ink-faint)}

  .exsheet td{padding:6px 8px}
  .exin{width:100%;box-sizing:border-box;border:1px solid transparent;background:transparent;font:inherit;color:var(--ink);padding:5px 7px;border-radius:6px}
  .exin:hover{border-color:var(--line-strong)}
  .exin:focus{outline:none;border-color:var(--brand);background:var(--panel)}
  .exin.exn{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .exdel{border:0;background:none;color:var(--ink-faint);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
  .exdel:hover{color:var(--red)}

  @media(max-width:760px){
    .app{flex-direction:column;height:auto;min-height:100%}
    .sidebar{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line)}
  }
  /* --- Login screen --- */
  .authwrap{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
  .authwrap[hidden]{display:none}
  .authcard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
  .authbrand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;color:var(--brand)}
  .authbrand span{color:var(--ink-faint);font-weight:700}
  .authsub{color:var(--ink-soft);font-size:13.5px;margin:4px 0 20px}
  .authcard input{width:100%;box-sizing:border-box;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line-strong);border-radius:10px;font:inherit;font-size:15px;background:var(--side);color:var(--ink)}
  .authcard input:focus{outline:none;border-color:var(--brand)}
  .authbtn{width:100%;padding:12px 14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px}
  .authbtn:disabled{opacity:.6;cursor:default}
  .authmsg{min-height:18px;font-size:12.5px;color:var(--ink-soft);margin-top:12px}
  .authtoggle{margin-top:14px;font-size:13px;color:var(--ink-soft)}
  .authtoggle a{color:var(--brand);text-decoration:none;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div id="authOverlay" class="authwrap">
  <div class="authcard">
    <div class="authbrand">Ohlly's <span>+ PYU</span></div>
    <div class="authsub">Sign in to your dashboard</div>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="authBtn" class="authbtn">Sign in</button>
    <div id="authMsg" class="authmsg"></div>
    <div class="authtoggle"><a id="authSwitch">New here? Create an account</a></div>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="name" id="brandName">Ohlly's</span><span class="pill"><span id="brandTag">analysis</span></span></div>

    <div class="acctwrap">
      <button class="account" id="acctBtn" type="button" aria-expanded="false">
        <span class="ico" id="acctIco" aria-hidden="true"></span>
        <span class="who"><b id="acctName">Ohlly's Cafe &mdash; Mabolo</b><small id="acctSub">East Labuan, Cebu City</small></span>
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="acctmenu" id="acctMenu" hidden>
        <div class="acctlabel">Switch business</div>
        <div id="acctOpts"></div>
      </div>
    </div>

    <nav id="navRoot"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Daily Report</h1>
      <span class="date" id="topDate"></span>
      <span class="chip" id="topChip">LIVE</span>
    </div>
    <div class="content">
      <p class="desc" id="viewDesc"></p>
      <div id="tilePanel">
        <div id="dateBar" hidden></div>
        <div id="filterBar" hidden></div>
        <div class="tiles" id="tileGrid"></div>
        <div id="reportTable" hidden></div>
        <p class="note" id="tileNote"></p>
      </div>
      <div id="configPanel" hidden>
        <div class="placeholder">
          <div class="pico" id="cfgIco"></div>
          <div>
            <h2 id="cfgHead"></h2>
            <p id="cfgBody"></p>
            <ul class="steps" id="cfgSteps"></ul>
          </div>
        </div>
        <p class="note">This screen is where you set up or review this part of the workflow. In the built app it becomes a form or table; here it's a preview of the structure.</p>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  var ICONS = {
    bars:'<path d="M5 21V11M12 21V4M19 21v-6M3 21h18"/>',
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    link:'<path d="M9.5 14.5l5-5"/><path d="M11 7.5l1-1a3.5 3.5 0 0 1 5 5l-1 1"/><path d="M13 16.5l-1 1a3.5 3.5 0 0 1-5-5l1-1"/>',
    money:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 12h.01M18 12h.01"/>',
    list:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.6 6h.01M3.6 12h.01M3.6 18h.01"/>',
    wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/>',
    cup:'<path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 9h2a2 2 0 0 1 0 4h-2"/><path d="M7 3v2M10 3v2M13 3v2"/>',
    truck:'<path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5"/><path d="M17.5 20a6 6 0 0 0-3-5"/>',
    tag:'<path d="M3 12l8-8 9 1 1 9-8 8z"/><circle cx="15" cy="9" r="1.4"/>',
    box:'<path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/>',
    receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',

  // POS item name (normalized, uppercase, no HOT/ICED, no parentheticals) -> menu item

  function posAliasMap(){ var a={},k; for(k in POS_ALIAS_DEFAULT) a[k]=POS_ALIAS_DEFAULT[k]; try{ var s=JSON.parse(LS.get('ohlly_pos_alias')||'null'); if(s&&typeof s==='object'){ for(k in s) a[k]=s[k]; } }catch(e){} return a; }

  function rebuildReports(){
    var imp=getImported(), byDate={}, k;
    BAKED_OHLLYS.forEach(function(r){ byDate[r.d]={d:r.d,m:r.m,live:r.live,imported:false,order:orderToMap(r.order)}; });
    Object.keys(imp).forEach(function(d){ var rec=imp[d]; if(!rec||!rec.o) return;
      if(!byDate[d]) byDate[d]={d:d,m:rec.m||reportMonthOf({d:d}),live:true,imported:true,order:{}};

    var arr=Object.keys(byDate).map(function(d){ var o=byDate[d], ord=[], kk; for(kk in o.order) ord.push([kk,o.order[kk]]); return {d:o.d,m:o.m,live:o.live,imported:o.imported,order:ord}; });

  function parsePOS(text){
    var doc; try{ doc=new DOMParser().parseFromString(text,'text/html'); }catch(e){ doc=null; }
    if(!doc||!doc.body) return {ok:false, err:'could not read the file'};
    var bodyText=doc.body.textContent.replace(/\s+/g,' ');
    var monthM=bodyText.match(/Month\s*(\d{1,2})/i);
    var dayM=text.match(/(\d{2})\/(\d{2})\/(\d{4})/);                 // sale date MM/DD/YYYY
    var printY=text.match(/(\d{2})\/(\d{2})\/(\d{2})\s+\d{1,2}:\d{2}/); // printed MM/DD/YY
    var d,m;
    if(dayM){ var mo=parseInt(dayM[1],10), da=parseInt(dayM[2],10), yr=parseInt(dayM[3],10); var mi=(mo-1+12)%12; d=MONTHS[mi]+' '+da; m=MONTHS[mi]+' '+yr; }
    else if(monthM){ var mn=parseInt(monthM[1],10), mi2=(mn-1+12)%12; var yr2=printY?2000+parseInt(printY[3],10):2026; d=MONTHS[mi2]+' '+yr2; m=d; }
    else return {ok:false, err:'no date found — is this a Category Sold export?'};
    var rows=[], trs=doc.getElementsByTagName('tr');
    for(var i=0;i<trs.length;i++){
      var tds=trs[i].getElementsByTagName('td'), cells=[];
      for(var j=0;j<tds.length;j++){ var t=(tds[j].textContent||'').replace(/\s+/g,' ').trim(); if(t) cells.push(t); }
      if(cells.length<4) continue;
      if(!/^\d{5,6}[a-zA-Z]?$/.test(cells[0])) continue;      // barcode marks a data row
      var pcs=-1; for(var p=0;p<cells.length;p++){ if(/^PCS$/i.test(cells[p])){ pcs=p; break; } }
      if(pcs<2) continue;
      var nm=cells[1], qty=parseFloat((cells[pcs-1]||'').replace(/,/g,''))||0;
      if(nm && qty>0) rows.push({pos:nm, qty:qty});
    }
    return {ok:true, d:d, m:m, rows:rows};
  }

  function importPOSText(text){
    var parsed=parsePOS(text);
    if(!parsed.ok) return {ok:false, err:parsed.err};
    if(!parsed.rows.length) return {ok:false, err:'no sales rows found in this file'};
    var matched={}, unmatched=[], mUnits=0, k;
    parsed.rows.forEach(function(r){ var c=mapPosItem(r.pos); if(c){ matched[c]=(matched[c]||0)+r.qty; mUnits+=r.qty; } else unmatched.push([r.pos,r.qty]); });
    var imp=getImported(); if(!imp[parsed.d]) imp[parsed.d]={m:parsed.m,o:{}}; imp[parsed.d].m=parsed.m;
    for(k in matched) imp[parsed.d].o[k]=matched[k];
    saveImported(imp); rebuildReports();
    selDate=parsed.d;
    return {ok:true, d:parsed.d, m:parsed.m, matched:Object.keys(matched).length, units:mUnits, unmatched:unmatched};
  }

  // ---- Transaction-report import: reads the full POS transaction listing (all stores mixed),
  //      keeps only Ohlly's menu items, groups by day, routes "FP" items to Foodpanda. ----
  function fpImpAll(){ try{ var s=JSON.parse(LS.get('ohlly_fp_imported')||'null'); if(s&&typeof s==='object') return s; }catch(e){} return {}; }
  function getFpImported(date){ var a=fpImpAll(); return a[date]||[]; }
  function parseTxn(text){
    if(!text) return {ok:false, recs:[]};
    // POS exports are Excel-style HTML that scatters each value across many cells,
    // so DOMParser's <td> reconstruction cannot rebuild rows. Parse the raw markup
    // with tag replacement instead: close-tr -> newline, close-cell -> ' | '.
    var t=(''+text).replace(/<\/tr>/gi,'\n').replace(/<\/t[dh]>/gi,' | ').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'')
      .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'");
    var lines=t.split('\n').map(function(l){ return l.replace(/\s+/g,' ').replace(/^[\s|]+/,'').replace(/[\s|]+$/,''); }).filter(function(l){ return l!==''; });
    var T=lines.join(' ').replace(/\s+/g,' ');
    var rx=/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AP]M)?\s*\|\s*(\d{6,8})\s*\|[^|]*?(\d+)\s*\|\s*\|\s*\d{6}\s*\|\s*([^|]+?)\s*\|\s*[\d.,]+\.\d{2}\s*\|\s*\|\s*([\d.,]+\.\d{2})/g;
    var m, recs=[];
    while((m=rx.exec(T))){ recs.push({mo:parseInt(m[1],10), da:parseInt(m[2],10), yr:parseInt(m[3],10), tn:(m[4]||'').trim(), qty:parseInt(m[5],10)||0, name:(m[6]||'').trim(), price:parseFloat((m[7]||'0').replace(/,/g,''))||0}); }
    return {ok:true, recs:recs};
  }
  function importTxnText(text){
    var p=parseTxn(text), k;
    if(!p.ok || !p.recs.length) return {ok:false, err:'no recognizable transactions in this file'};
    var inStore={}, fpd={}, excl={};
    p.recs.forEach(function(r){
      var mi=(r.mo-1+12)%12, d=MONTHS[mi]+' '+r.da, m=MONTHS[mi]+' '+r.yr;
      var isFp=/^FP\b/i.test(r.name), core=r.name.replace(/^FP\s+/i,''), canon=mapPosItem(core);
      if(isFp){
        if(canon){ if(!fpd[d]) fpd[d]={}; if(!fpd[d][canon]) fpd[d][canon]={q:0,p:r.price}; fpd[d][canon].q+=r.qty; }
        else { excl[r.name]=(excl[r.name]||0)+r.qty; }
      } else if(canon){
        if(!inStore[d]) inStore[d]={m:m,o:{},tx:{}}; inStore[d].o[canon]=(inStore[d].o[canon]||0)+r.qty;
        if(r.tn){ inStore[d].tx[r.tn]=(inStore[d].tx[r.tn]||0)+r.qty*r.price; }
      } else { excl[r.name]=(excl[r.name]||0)+r.qty; }
    });
    var imp=getImported(), units=0, dd;
    for(dd in inStore){ if(!imp[dd]) imp[dd]={m:inStore[dd].m,o:{}}; imp[dd].m=inStore[dd].m; for(k in inStore[dd].o){ imp[dd].o[k]=inStore[dd].o[k]; units+=inStore[dd].o[k]; } }
    saveImported(imp);
    // Per-day map of Ohlly's transaction# -> Ohlly's amount, so a payment report can be filtered to Ohlly's only
    var txAll={}; try{ txAll=JSON.parse(LS.get('ohlly_txpay')||'{}'); }catch(e){}
    for(dd in inStore){ txAll[dd]=inStore[dd].tx||{}; }
    LS.set('ohlly_txpay', JSON.stringify(txAll));
    var fpi=fpImpAll(), fpDays=0;
    for(dd in fpd){ fpDays++; var rows=[]; for(k in fpd[dd]) rows.push([k, fpd[dd][k].q, fpd[dd][k].p]); fpi[dd]=rows; }
    LS.set('ohlly_fp_imported', JSON.stringify(fpi));
    rebuildReports();
    var dayList=Object.keys(inStore).sort(function(a,b){ return repDateKey({d:a})-repDateKey({d:b}); });
    if(dayList.length) selDate=dayList[dayList.length-1];
    var exN=0; for(k in excl) exN++;
    return {ok:true, kind:'txn', days:dayList.length, units:units, fpDays:fpDays, dayList:dayList, excluded:exN};
  }

  // Parse a POS "Payment History" (a.k.a. denomination) export: per-transaction channel + amount.
  function parsePayments(text){
    if(!text) return {ok:false, err:'empty file'};
    var t=(''+text).replace(/<\/tr>/gi,'\n').replace(/<\/t[dh]>/gi,' | ').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'')
      .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'");
    var lines=t.split('\n').map(function(l){ return l.replace(/\s+/g,' ').replace(/^[\s|]+/,'').replace(/[\s|]+$/,''); }).filter(function(l){ return l!==''; });
    var T=lines.join(' ').replace(/\s+/g,' ');
    if(!/ONSPOT/.test(T) && !/Payment\s*History/i.test(T)) return {ok:false, err:'this doesn’t look like a POS payment report'};
    var rx=/\b(?:SALES|REFUND)\s*\|\s*([\d.,]+\.\d{2})\s*\|\s*\|\s*([A-Z][A-Z\/]*)\s*\|\s*ONSPOT\s*\|[^|]*\|[^|]*\|[^|]*\|\s*(\d{6,8})\b/g;
    var m, recs=[], byTn={};
    while((m=rx.exec(T))){
      var amt=parseFloat((m[1]||'0').replace(/,/g,''))||0, pt=(m[2]||'').toUpperCase(), tn=(m[3]||'').trim();
      var ch = pt.indexOf('CASH')===0 ? 'Cash' : (pt.indexOf('CARD')===0 ? 'Card' : ((pt.indexOf('GCASH')===0||pt.indexOf('MAYA')>=0) ? 'GCash' : 'Other'));
      recs.push({tn:tn, ch:ch, amt:amt}); if(tn) byTn[tn]=ch;
    }
    if(!recs.length) return {ok:false, err:'no payment rows found in this file'};
    var dm=T.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/), label='';
    if(dm){ var mo=parseInt(dm[1],10), da=parseInt(dm[2],10); label=MONTHS[(mo-1+12)%12]+' '+da; }
    return {ok:true, label:label, recs:recs, byTn:byTn};
  }
  function importPaymentFile(text){
    var p=parsePayments(text);
    if(!p.ok) return {ok:false, err:p.err};
    var dates=BUS.ohllys.reports.map(function(r){return r.d;});
    var day = (p.label && dates.indexOf(p.label)>=0) ? p.label : ((dates.indexOf(selDate)>=0)?selDate:p.label);
    if(dates.indexOf(day)<0) return {ok:false, err:'import the Daily Sales Report for '+(p.label||'that day')+' first, then upload this'};
    var txAll={}; try{ txAll=JSON.parse(LS.get('ohlly_txpay')||'{}'); }catch(e){}
    var tx=txAll[day]||{}, keys=Object.keys(tx);
    if(!keys.length) return {ok:false, err:'no Ohlly’s transactions stored for '+day+' — re-import that day’s transaction sales file first'};
    var split={Cash:0,Card:0,GCash:0}, matched=0, unmatched=0, total=0;
    keys.forEach(function(tn){ var amt=tx[tn]||0, ch=p.byTn[tn];
      if(ch && split.hasOwnProperty(ch)){ split[ch]+=amt; matched++; total+=amt; } else { unmatched++; }
    });
    var mi=getMoneyIn(day);
    mi.rows.forEach(function(r){ var nm=(r[0]||'').toLowerCase();
      if(nm.indexOf('cash')===0 && nm.indexOf('gcash')<0) r[1]=Math.round(split.Cash);
      else if(nm.indexOf('card')===0) r[1]=Math.round(split.Card);
      else if(nm.indexOf('gcash')>=0 || nm.indexOf('maya')>=0) r[1]=Math.round(split.GCash);
    });
    mi.counted=Math.round(split.Cash);
    saveMoneyIn(day, mi);
    miLastMsg='<span style="color:var(--good)">Ohlly’s-only split for '+day+' — matched '+matched+' of '+keys.length+' transaction(s) · Cash '+P+money(split.Cash)+' · Card '+P+money(split.Card)+' · GCash '+P+money(split.GCash)+' = '+P+money(total)+'</span>'+(unmatched?' <span style="color:var(--amber)">('+unmatched+' not found in the payment file)</span>':'');
    selDate=day; renderMoneyIn();
    return {ok:true, day:day, split:split, matched:matched, unmatched:unmatched};
  }

    $('tileGrid').innerHTML=g;
    var h='<div class="rtwrap"><table class="rt"><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Sales</th><th class="n">COGS</th><th class="n">Gross</th><th class="n">FC%</th></tr></thead><tbody>';
    c.rows.forEach(function(x){ h+='<tr><td>'+x[0]+'</td><td class="n">'+x[1]+'</td><td class="n">'+P+money(x[2])+'</td><td class="n">'+P+money(x[3])+'</td><td class="n">'+P+money(x[4])+'</td><td class="n">'+x[5].toFixed(1)+'%</td></tr>'; });
    h+='<tr class="tot"><td>Total</td><td class="n">'+c.units+'</td><td class="n">'+P+money(c.sales)+'</td><td class="n">'+P+money(c.cogs)+'</td><td class="n">'+P+money(c.gross)+'</td><td class="n">'+c.fc.toFixed(1)+'%</td></tr>';
    h+='</tbody></table></div>';
    h+='<h3 style="font-family:\'Bricolage Grotesque\',sans-serif;font-size:16px;margin:26px 0 6px;color:var(--ink)">Add items sold manually</h3>';
    h+='<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px">For items you didn’t export — pick one, set the quantity, Add. They merge into the totals above for <b>'+r.d+'</b>.</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><select class="exin" id="manItem" style="flex:1;min-width:200px;border:1px solid var(--line-strong)">'+itemOptions()+'</select><input class="exin exn" id="manQty" value="1" style="max-width:70px;border:1px solid var(--line-strong)"><button class="upbtn" id="manAdd">+ Add</button></div>';
    if(manual.length){
      h+='<div class="rtwrap"><table class="rt exsheet"><thead><tr><th>Manually added</th><th class="n">Qty</th><th class="n">Sales</th><th class="n">COGS</th><th></th></tr></thead><tbody id="manBody">';
      manual.forEach(function(m,i){ var it=ITEM[m[0]]||[0,0]; var q=parseFloat(m[1])||0; h+='<tr data-i="'+i+'"><td>'+m[0]+'</td><td><input class="exin exn manq" value="'+esc(m[1])+'" style="max-width:60px"></td><td class="n">'+P+money(it[0]*q)+'</td><td class="n">'+P+money(it[1]*q)+'</td><td><button class="exdel" title="Remove">&times;</button></td></tr>'; });
      h+='</tbody></table></div>';
    }
    h+=fpSectionHTML(r.d);
    $('reportTable').innerHTML=h; $('reportTable').hidden=false;
    wireFp(r.d);
    if($('manAdd')) $('manAdd').addEventListener('click', function(){ var nm=$('manItem').value, q=parseFloat($('manQty').value)||0; if(!nm||q<=0){ return; } var rows=getManual(r.d); rows.push([nm,q]); saveManual(r.d,rows); renderReportBody(bus); });
    var mb=$('manBody');
    if(mb){
      Array.prototype.forEach.call(mb.querySelectorAll('.manq'), function(inp){ inp.addEventListener('change', function(){ var rows=getManual(r.d); var i=+inp.closest('tr[data-i]').getAttribute('data-i'); rows[i][1]=parseFloat(inp.value)||0; saveManual(r.d,rows); renderReportBody(bus); }); });
      Array.prototype.forEach.call(mb.querySelectorAll('.exdel'), function(b){ b.addEventListener('click', function(){ var rows=getManual(r.d); rows.splice(+b.closest('tr[data-i]').getAttribute('data-i'),1); saveManual(r.d,rows); renderReportBody(bus); }); });
    }
    $('tileNote').innerHTML = (r.live?'Live data — '+r.d+'.':'Sample data for '+r.d+'.')+' <b>+ Add file</b> (top) imports a POS “Category Sold” export and auto-fills the day — upload each category file and they fold together. <b>Add items sold manually</b> covers anything not in an export. '+(fpSectionHTML(r.d)?'Foodpanda is tracked separately below. ':'')+'Net profit needs the day’s expenses.';
  }

  navRoot.addEventListener('click', function(e){
    var btn=e.target.closest('[data-id]'); if(!btn) return;
    var g=btn.getAttribute('data-group');
    if(g){ var box=$(g); var open=box.classList.toggle('open'); btn.setAttribute('aria-expanded', open?'true':'false'); }
    setActive(btn); showView(reg[btn.getAttribute('data-id')]);
  });

  function loadBusiness(key){
    current=key; selDate=null; weekView=null; itemFilter='all';
    var bus=BUS[key];
    $('brandName').textContent=bus.brand;
    $('brandTag').textContent=bus.tag;
    $('acctIco').innerHTML=svg(bus.acct.icon);
    $('acctName').innerHTML=bus.acct.name;
    $('acctSub').innerHTML=bus.acct.sub;
    renderNav(bus);
    var first=navRoot.querySelector('.navitem');
    setActive(first); showView(bus.nav[0].items[0]);
    renderAcctOpts();
  }

  // Per-business data keys cleared by the Reset button (menu/recipe config like ohlly_pos_alias is kept).
  var RESET_KEYS={
    ohllys:{ 'ohlly_imported':'{}','ohlly_fp_imported':'{}','ohlly_fp_manual':'{}','ohlly_manual':'{}','ohlly_txpay':'{}','ohlly_moneyin':'{}','ohlly_expenses':'{}','ohlly_ingredient_use':'{}' },
    pyu:{ 'pyu_prices':'null','pyu_salary':'null','pyu_exp':'null','pyu_cheques':'null','pyu_paid':'{}','pyu_deadlines':'{}','pyu_terms':'null','pyu_stmt_docs':'null','pyu_customers':'null' }
  };
  function resetBusinessData(key){
    var map=RESET_KEYS[key]||{}; for(var k in map){ LS.set(k, map[k]); }
    try{ rebuildReports(); }catch(e){}
  }
  function renderAcctOpts(){
    var order=['ohllys','pyu'].filter(function(k){ return !BIZ.length || BIZ.indexOf(k)>=0; }); if(!order.length) order=['ohllys'];
    var html='';
    order.forEach(function(key){
      var b=BUS[key];
      html+='<button class="acctopt'+(key===current?' active':'')+'" data-bus="'+key+'"><span class="ico">'+svg(b.acct.icon)+'</span><span class="who"><b>'+b.acct.name+'</b><small>'+b.acct.sub+'</small></span><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"/></svg></span></button>';
    });
    html+='<button class="acctopt" data-reset="'+current+'" style="margin-top:4px;border-top:1px solid var(--line)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg></span><span class="who"><b>Reset '+BUS[current].acct.name+' data</b><small>clear days, splits &amp; entries</small></span></button>';
    html+='<button class="acctopt" data-signout="1" style="border-top:1px solid var(--line)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></span><span class="who"><b>Sign out</b><small>end this session</small></span></button>';
    $('acctOpts').innerHTML=html;
  }

  var acctBtn=$('acctBtn'), acctMenu=$('acctMenu');
  function closeMenu(){ acctMenu.hidden=true; acctBtn.setAttribute('aria-expanded','false'); }
  acctBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open=acctMenu.hidden;
    acctMenu.hidden=!open; acctBtn.setAttribute('aria-expanded', open?'true':'false');
  });
  $('acctOpts').addEventListener('click', function(e){
    var so=e.target.closest('[data-signout]'); if(so){ closeMenu(); signOut(); return; }
    var rs=e.target.closest('[data-reset]'); if(rs){ var key=rs.getAttribute('data-reset'), nm=BUS[key].acct.name;
      if(window.confirm('Reset all '+nm+' data?\n\nThis clears imported days, Money In splits, manual entries, expenses and usage for '+nm+'. The menu and recipes are kept. This cannot be undone.')){ resetBusinessData(key); closeMenu(); loadBusiness(key); }
      else { closeMenu(); }
      return; }
    var opt=e.target.closest('[data-bus]'); if(!opt) return;
    loadBusiness(opt.getAttribute('data-bus')); closeMenu();
  });
  document.addEventListener('click', function(e){ if(!e.target.closest('.acctwrap')) closeMenu(); });

  try{ $('topDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }catch(e){}

  // ---- Auth + boot (Supabase email + password) ----
  var SUPA_URL='https://nygasvzaseirnhupdwqu.supabase.co';
  var SUPA_KEY='sb_publishable_qAl41VaKm4FfEkAZ6-D5Kg_NQ2drzXz';
  var authMode='in';
  function setAuthMsg(t,err){ var m=$('authMsg'); if(!m) return; m.textContent=t||''; m.style.color=err?'var(--red)':'var(--ink-soft)'; }
  function updateAuthLabels(){ var b=$('authBtn'), s=$('authSwitch'); if(b) b.textContent=authMode==='in'?'Sign in':'Create account'; if(s) s.textContent=authMode==='in'?'New here? Create an account':'Have an account? Sign in'; }
  function showLogin(){ var o=$('authOverlay'); if(o) o.hidden=false; var e=$('authEmail'); if(e){ try{ e.focus(); }catch(x){} } }
  function hideLogin(){ var o=$('authOverlay'); if(o) o.hidden=true; }
  function doAuth(){
    if(!SB) return;
    var email=(($('authEmail')||{}).value||'').trim(), pass=(($('authPass')||{}).value||'');
    if(!email||!pass){ setAuthMsg('Enter your email and password.', true); return; }
    var b=$('authBtn'); if(b) b.disabled=true;
    setAuthMsg(authMode==='in'?'Signing in…':'Creating your account…', false);
    var p = authMode==='in' ? SB.auth.signInWithPassword({email:email,password:pass}) : SB.auth.signUp({email:email,password:pass});
    p.then(function(res){
      if(b) b.disabled=false;
      if(res && res.error){ setAuthMsg(res.error.message||'Something went wrong.', true); return; }
      if(authMode==='up' && !(res.data && res.data.session)){ setAuthMsg('Account created — check your email to confirm, then sign in.', false); authMode='in'; updateAuthLabels(); return; }
      SESSION = res.data && res.data.session;
      afterLogin();
    }, function(){ if(b) b.disabled=false; setAuthMsg('Network error — please try again.', true); });
  }
  function wireAuth(){
    var sw=$('authSwitch'); if(sw) sw.addEventListener('click', function(e){ e.preventDefault(); authMode=(authMode==='in'?'up':'in'); updateAuthLabels(); setAuthMsg('',false); });
    var b=$('authBtn'); if(b) b.addEventListener('click', doAuth);
    ['authEmail','authPass'].forEach(function(id){ var el=$(id); if(el) el.addEventListener('keydown', function(e){ if(e.key==='Enter') doAuth(); }); });
  }
  function loadMemberships(){
    return SB.from('memberships').select('business,role').then(function(res){ BIZ=((((res||{}).data))||[]).map(function(r){ return r.business; }); }, function(){ BIZ=[]; });
  }
  function afterLogin(){
    hideLogin();
    loadMemberships().then(function(){ return loadAllData(); }).then(function(){
      subscribeRealtime();
      rebuildReports();
      loadBusiness(BIZ.indexOf('ohllys')>=0 ? 'ohllys' : (BIZ[0]||'ohllys'));
    });
  }
  function signOut(){ if(SB){ try{ SB.auth.signOut().then(function(){ location.reload(); }, function(){ location.reload(); }); }catch(e){ location.reload(); } } }
  function boot(){
    wireAuth();
    try{ SB = window.supabase.createClient(SUPA_URL, SUPA_KEY); }catch(e){ showLogin(); setAuthMsg('Could not connect — refresh to try again.', true); return; }
    SB.auth.getSession().then(function(res){
      SESSION = res && res.data && res.data.session;
      if(!SESSION){ showLogin(); return; }
      afterLogin();
    }, function(){ showLogin(); });
    SB.auth.onAuthStateChange(function(evt){ if(evt==='SIGNED_OUT'){ try{ location.reload(); }catch(e){} } });
  }
  boot();
})();
</script>
